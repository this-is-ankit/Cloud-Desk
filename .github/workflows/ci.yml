name: Cloud-Desk CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20"

jobs:
  # ╔══════════════════════════════════════════╗
  # ║         STAGE 1: Lint & Test             ║
  # ╚══════════════════════════════════════════╝

  test-backend:
    name: 🔧 Backend — Install & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Uncomment when you add tests to backend/package.json:
      # - name: Run tests
      #   working-directory: backend
      #   run: npm test

  test-frontend:
    name: 🎨 Frontend — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Provide dummy values so the build doesn't fail on missing env vars
          VITE_API_URL: http://localhost:3000
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_STREAM_API_KEY: placeholder
          VITE_ENABLE_DEV_AUTH: "false"

  # ╔══════════════════════════════════════════╗
  # ║     STAGE 2: Docker Build & Push         ║
  # ╚══════════════════════════════════════════╝

  build-and-push:
    name: 🐳 Docker Build & Push
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      # ---- Backend Image ----
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-desk-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-desk-backend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Frontend Image ----
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_STREAM_API_KEY=${{ secrets.VITE_STREAM_API_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-desk-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-desk-frontend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ╔══════════════════════════════════════════╗
  # ║          STAGE 3: Deployment             ║
  # ╚══════════════════════════════════════════╝

  deploy:
    name: 🚀 Deploy to Render
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy (Backend)
        run: curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}

      - name: Trigger Render Deploy (Frontend)
        run: curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
