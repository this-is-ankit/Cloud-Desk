services:
  # ---- Backend Service ----
  - type: web
    name: cloud-desk-backend
    env: docker
    repo: https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME # Update this
    dockerContext: ./backend
    plan: free # or starter
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - fromGroup: cloud-desk-secrets # We'll define a secret group below
      - key: REDIS_URL
        fromService:
          type: redis
          name: cloud-desk-redis
          property: connectionString

  # ---- Frontend Service ----
  - type: web
    name: cloud-desk-frontend
    env: docker
    repo: https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME # Update this
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://cloud-desk-backend.onrender.com # Render URL
      - fromGroup: cloud-desk-secrets

  # ---- Redis Service ----
  - type: redis
    name: cloud-desk-redis
    plan: free
    ipAllowList: [] # Only allow internal traffic

# ---- Secrets Group ----
# You can manage these in the Render Dashboard under "Env Groups"
envVarGroups:
  - name: cloud-desk-secrets
    envVars:
      - key: DB_URL
      - key: CLERK_SECRET_KEY
      - key: CLERK_PUBLISHABLE_KEY
      - key: VITE_CLERK_PUBLISHABLE_KEY
      - key: STREAM_API_KEY
      - key: VITE_STREAM_API_KEY
      - key: STREAM_API_SECRET
      - key: INNGEST_EVENT_KEY
      - key: INNGEST_SIGNING_KEY
